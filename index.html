<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          if (typeof window !== 'undefined') {
            var w = window;
            if (!w.chrome) w.chrome = {};
            if (!w.chrome.runtime) {
              w.chrome.runtime = {
                onMessage: { addListener: function () {}, removeListener: function () {}, hasListener: function () { return false; } },
                onConnect: { addListener: function () {}, removeListener: function () {}, hasListener: function () { return false; } },
                sendMessage: function () {}
              };
            } else if (!w.chrome.runtime.onMessage) {
              w.chrome.runtime.onMessage = {
                addListener: function () {},
                removeListener: function () {},
                hasListener: function () { return false; }
              };
            }
            var shouldIgnoreError = function (msg, source, stack) {
              var m = String(msg || '');
              var s = String(source || '');
              var st = String(stack || '');
              return (
                s.indexOf('chrome-extension://') !== -1 ||
                s.indexOf('moz-extension://') !== -1 ||
                st.indexOf('chrome-extension://') !== -1 ||
                m.indexOf("reading 'onMessage'") !== -1 ||
                m.indexOf('WebSocket closed without opened') !== -1
              );
            };
            w.addEventListener(
              'error',
              function (e) {
                if (shouldIgnoreError(e.message, e.filename, e.error && e.error.stack)) {
                  e.stopImmediatePropagation();
                  e.stopPropagation();
                  e.preventDefault();
                  return true;
                }
              },
              true
            );
            w.addEventListener(
              'unhandledrejection',
              function (e) {
                var r = e.reason;
                if (shouldIgnoreError(r && r.message ? r.message : r, '', r && r.stack)) {
                  e.stopImmediatePropagation();
                  e.stopPropagation();
                  e.preventDefault();
                }
              },
              true
            );
            w.addEventListener('beforeinstallprompt', function (e) {
              e.preventDefault();
              w.__deferredPwaPrompt = e;
              w.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
            });
            w.addEventListener('appinstalled', function () {
              w.__deferredPwaPrompt = null;
              w.dispatchEvent(new CustomEvent('pwa-installed'));
            });
          }
        } catch (_) {}
      })();
    </script>

    <div id="root"></div>
    <script>
      (function () {
        var booted = false;
        function bootApp() {
          if (booted) return;
          booted = true;
          var s = document.createElement('script');
          s.type = 'module';
          s.src = '/src/main.tsx?v=6';
          document.body.appendChild(s);
          if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
              navigator.serviceWorker
                .register('/sw.js?v=6')
                .then(function (reg) {
                  try { reg.update(); } catch (_) {}
                })
                .catch(function () {});
            });
          }
        }
        try {
          if ('caches' in window) {
            var timer = setTimeout(bootApp, 120);
            caches
              .keys()
              .then(function (keys) {
                var stale = keys.filter(function (k) {
                  return k !== 'plan-uek-pwa-v6';
                });
                if (stale.length === 0) {
                  clearTimeout(timer);
                  bootApp();
                  return;
                }
                return Promise.all(
                  stale.map(function (k) {
                    return caches.delete(k);
                  })
                ).then(function () {
                  clearTimeout(timer);
                  if (
                    'serviceWorker' in navigator &&
                    navigator.serviceWorker.controller &&
                    !sessionStorage.getItem('uek_sw_v6_reset')
                  ) {
                    sessionStorage.setItem('uek_sw_v6_reset', '1');
                    navigator.serviceWorker
                      .getRegistrations()
                      .then(function (regs) {
                        return Promise.all(
                          regs.map(function (r) {
                            return r.unregister();
                          })
                        );
                      })
                      .then(function () {
                        window.location.reload();
                      })
                      .catch(function () {
                        bootApp();
                      });
                  } else {
                    bootApp();
                  }
                });
              })
              .catch(function () {
                clearTimeout(timer);
                bootApp();
              });
          } else {
            bootApp();
          }
        } catch (_) {
          bootApp();
        }
      })();
    </script>
