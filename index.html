<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          if (typeof window !== 'undefined') {
            var w = window;
            var origConsoleError = console.error;
            console.error = function () {
              var args = Array.prototype.slice.call(arguments);
              var joined = args
                .map(function (a) {
                  return String(a && a.stack ? a.stack : a && a.message ? a.message : a);
                })
                .join(' ');
              if (
                joined.indexOf('WebSocket closed without opened') !== -1 ||
                joined.indexOf('@vite/client') !== -1 ||
                joined.indexOf("reading 'onMessage'") !== -1
              ) {
                return;
              }
              return origConsoleError.apply(console, arguments);
            };

            if (w.WebSocket) {
              var OrigWS = w.WebSocket;
              var PatchedWS = function (url, protocols) {
                var ws = protocols !== undefined ? new OrigWS(url, protocols) : new OrigWS(url);
                ws.addEventListener(
                  'error',
                  function (e) {
                    if (e && e.stopImmediatePropagation) e.stopImmediatePropagation();
                    if (e && e.preventDefault) e.preventDefault();
                  },
                  true
                );
                return ws;
              };
              PatchedWS.prototype = OrigWS.prototype;
              PatchedWS.CONNECTING = OrigWS.CONNECTING;
              PatchedWS.OPEN = OrigWS.OPEN;
              PatchedWS.CLOSING = OrigWS.CLOSING;
              PatchedWS.CLOSED = OrigWS.CLOSED;
              w.WebSocket = PatchedWS;
            }

            if (!w.chrome) w.chrome = {};
            if (!w.chrome.runtime) {
              w.chrome.runtime = {
                onMessage: { addListener: function () {}, removeListener: function () {}, hasListener: function () { return false; } },
                onConnect: { addListener: function () {}, removeListener: function () {}, hasListener: function () { return false; } },
                sendMessage: function () {}
              };
            } else if (!w.chrome.runtime.onMessage) {
              w.chrome.runtime.onMessage = {
                addListener: function () {},
                removeListener: function () {},
                hasListener: function () { return false; }
              };
            }
            var shouldIgnoreError = function (msg, source, stack) {
              var m = String(msg || '');
              var s = String(source || '');
              var st = String(stack || '');
              return (
                s.indexOf('chrome-extension://') !== -1 ||
                s.indexOf('moz-extension://') !== -1 ||
                st.indexOf('chrome-extension://') !== -1 ||
                m.indexOf("reading 'onMessage'") !== -1 ||
                m.indexOf('WebSocket closed without opened') !== -1 ||
                st.indexOf('@vite/client') !== -1 ||
                s.indexOf('@vite/client') !== -1
              );
            };
            w.addEventListener(
              'error',
              function (e) {
                if (shouldIgnoreError(e.message, e.filename, e.error && e.error.stack)) {
                  e.stopImmediatePropagation();
                  e.stopPropagation();
                  e.preventDefault();
                  return true;
                }
              },
              true
            );
            w.addEventListener(
              'unhandledrejection',
              function (e) {
                var r = e.reason;
                if (shouldIgnoreError(r && r.message ? r.message : r, '', r && r.stack)) {
                  e.stopImmediatePropagation();
                  e.stopPropagation();
                  e.preventDefault();
                }
              },
              true
            );
            w.addEventListener('beforeinstallprompt', function (e) {
              e.preventDefault();
              w.__deferredPwaPrompt = e;
              w.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
            });
            w.addEventListener('appinstalled', function () {
              w.__deferredPwaPrompt = null;
              w.dispatchEvent(new CustomEvent('pwa-installed'));
            });
            if ('caches' in w) {
              caches.keys().then(function (keys) {
                keys.forEach(function (k) {
                  if (k !== 'plan-uek-pwa-v12') {
                    caches.delete(k);
                  }
                });
              }).catch(function () {});
            }
            if ('serviceWorker' in navigator) {
              w.addEventListener('load', function () {
                navigator.serviceWorker
                  .register('/sw.js')
                  .then(function (reg) {
                    try { reg.update(); } catch (_) {}
                  })
                  .catch(function () {});
              });
            }
          }
        } catch (_) {}
      })();
    </script>
